name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "service/**"
      - "frontend/**"
      - "protocol/**"
      - "Makefile"
  pull_request:
    branches: ["main"]
    paths:
      - "service/**"
      - "frontend/**"
      - "protocol/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install buf
        run: |
          BIN="/usr/local/bin/buf"
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-x86_64" -o "$BIN"
          chmod +x "$BIN"

      - name: Generate and test
        run: |
          make generate
          (cd service && go mod tidy)
          git diff --exit-code service/go.mod service/go.sum
          make -wC service test
          make -wC service build
          make -wC frontend build
