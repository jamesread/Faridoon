# Marketing screenshots, captured by `make` in this directory against the
# throwaway stack it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = Faridoon
manifest_base_url = https://raw.githubusercontent.com/jamesread/Faridoon/main/var/marketing/screenshots/

[quotes]
url = quotes
title = Latest quotes
description = The front page lists the newest quotes, with each chat username highlighted in its own colour. Signed-in users can vote quotes up or down.

[quote]
url = quotes/7
height = 340
title = Quote permalink
description = Every quote has its own page, so a favourite exchange is easy to link to and share.

[add-quote]
url = quotes/create
height = 660
script = scripts/light.py, scripts/prepare.py, scripts/add_quote.py
title = Add a quote
description = Paste a chat log and a live preview shows exactly how the quote will look before it is submitted.

[approvals]
url = approvals
height = 540
title = Approval queue
description = Quotes from guests and regular users wait in an approval queue, where moderators can approve, reject or tidy them up before they go live.

[settings]
url = control-panel/settings
title = Settings
description = Admins configure the site from the browser, including the site title, voting, registration, guest submissions and theme, with no config files to edit.

# Dark variants last; the browser session (and localStorage) is shared.
[quotes-dark]
url = quotes
script = scripts/dark.py, scripts/prepare.py
theme = dark
title = Dark mode
description = A built-in dark theme, which users can switch to from the header.
